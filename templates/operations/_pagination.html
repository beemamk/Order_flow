{% if page.paginator.num_pages > 1 %}<div class="flex items-center justify-between border-t border-slate-800 px-5 py-4 text-xs text-slate-500"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div class="flex gap-2">{% if page.has_previous %}<a class="btn-secondary py-1.5" href="?page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn-secondary py-1.5" href="?page={{ page.next_page_number }}">Next</a>{% endif %}</div></div>{% endif %}
